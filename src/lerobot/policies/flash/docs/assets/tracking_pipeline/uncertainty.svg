<text x="295" y="904" font-size="19" fill="#52647a" font-weight="normal" text-anchor="middle">Same pivot; different orientations</text>
<text x="585" y="765" font-size="25" fill="#18283e" font-weight="bold" text-anchor="start">Which way is it pointing?</text>
<text x="585" y="805" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">Example tilt spread: 8 degrees.</text>
<text x="585" y="845" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">The whole object rotates together.</text>
<text x="585" y="885" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">Its surface does not bend.</text>
<text x="35" y="974" font-size="23" fill="#18283e" font-weight="bold" text-anchor="start">One 6 × 6 covariance includes all six directions and their correlations.</text>
</g></svg>
