<text x="585" y="213" font-size="25" fill="#18283e" font-weight="bold" text-anchor="start">Are these measured points correct?</text>
<text x="585" y="254" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">Depth noise changes individual points.</text>
<text x="585" y="293" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">A wrong alignment shifts a whole patch.</text>
<text x="585" y="332" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">The working surface can be distorted.</text>
