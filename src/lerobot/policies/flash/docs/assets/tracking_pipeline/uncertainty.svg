<text x="295" y="621" font-size="19" fill="#52647a" font-weight="normal" text-anchor="middle">Long ellipse = less certain sideways</text>
<text x="585" y="487" font-size="25" fill="#18283e" font-weight="bold" text-anchor="start">Where is the whole object?</text>
<text x="585" y="527" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">Example spread: 10 mm sideways,</text>
<text x="585" y="559" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">2 mm vertically (standard deviations).</text>
<text x="585" y="600" font-size="23" fill="#18283e" font-weight="normal" text-anchor="start">Each candidate keeps the same shape.</text>
<text x="65" y="714" font-size="27" fill="#18283e" font-weight="bold" text-anchor="start">3. Same 6D pose: orientation</text>
<g transform="rotate(-16 295 815)" opacity="0.15"><rect x="140" y="797" width="310" height="36" rx="18" fill="#b9d9f0" stroke="#287abc" stroke-width="3"/><path d="M295 815 L420 815" stroke="#287abc" stroke-width="3"/></g>
